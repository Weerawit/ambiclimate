services:
  ambi-hub:
    build: .
    container_name: ambi-hub
    restart: unless-stopped
    # network_mode: "host" is recommended for Linux/Raspberry Pi (Raspbian Buster) to bind host ports & UDP broadcasts directly
    network_mode: "host"
    environment:
      - HOST_IP=192.168.1.199
      - WEB_PORT=9090
      # Optional overrides:
      # - ROUTER_WAN_IP=
      # - DNS_REDIRECT_IP=
    volumes:
      - ./user_comfort_profile.json:/app/user_comfort_profile.json
      - ./hub_activity.log:/app/hub_activity.log

    # If running on Docker Desktop (Windows/macOS) where network_mode: "host" is not supported:
    # comment out network_mode: "host" and uncomment ports below:
    # ports:
    #   - "9090:9090"        # Web Dashboard
    #   - "8866:8866"        # Cloud Mock (TCP)
    #   - "8867:8867"        # Cloud Mock (TLS)
    #   - "80:80"            # HTTP
    #   - "443:443"          # HTTPS
    #   - "53:53/udp"        # DNS Redirect Server
    #   - "9131:9131/udp"    # AMX Beacon Discovery
